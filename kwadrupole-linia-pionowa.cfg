# Zbiór konfiguracyjny - Sterowanie prądami kwadrupoli w linii pionowej

Port szeregowy: /dev/ttyS5
#Port szeregowy: /dev/ttyUSB0

Tytuł kanału 1: Kwadrupol górny
Tytuł kanału 2: Kwadrupol dolny

Maksymalna wartość zadana prądu w kanale 1: 8A
Minimalna wartość zadana prądu w kanale 1: -8A

Maksymalna wartość zadana prądu w kanale 2: 9A
Minimalna wartość zadana prądu w kanale 2: -9A

# Limity czasu reakcji w milisekundach
Limit czasu włączania:   8000
Limit czasu wyłączania: 15000
Limit czasu ustawiania:  2000


